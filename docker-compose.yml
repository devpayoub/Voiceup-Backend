name: voiceup

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voiceup}
      POSTGRES_USER: ${POSTGRES_USER:-voiceup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voiceup}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voiceup}"]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_DB: ${POSTGRES_DB:-voiceup}
      POSTGRES_USER: ${POSTGRES_USER:-voiceup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voiceup}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
